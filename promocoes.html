$promocoes = array_filter($todosAtivos, function ($p) {
    return isset($p['promocao']) && $p['promocao'] === true;
});

$tituloPagina = 'Promoções - Construlink';
$paginaAtiva = 'promocoes';
require 'includes/header.php';

<!-- ============================================================
     HTML/CSS — equipe de front-end mexe livremente aqui
     ============================================================ -->

<div class="produtos">
    <h2>Promoções da Semana</h2>

    <?php if (isset($_GET['adicionado'])): ?>
        <p class="mensagem-sucesso">Produto adicionado ao carrinho!</p>
    <?php endif; ?>
    <?php if (isset($_GET['semestoque'])): ?>
        <p class="mensagem-erro">Não há mais estoque suficiente desse produto.</p>
    <?php endif; ?>

    <?php if (empty($promocoes)): ?>
        <p>Nenhuma promoção ativa no momento.</p>
    <?php endif; ?>

    <?php foreach ($promocoes as $produto): ?>
        <article class="produto">
            <img src="<?php echo htmlspecialchars($produto['imagem']); ?>" alt="<?php echo htmlspecialchars($produto['nome']); ?>">
            <h3><?php echo htmlspecialchars($produto['nome']); ?></h3>
            <p>
                <?php if (!empty($produto['precoAntigo'])): ?>
                    <del>R$ <?php echo number_format($produto['precoAntigo'], 2, ',', '.'); ?></del>
                <?php endif; ?>
                <strong>R$ <?php echo number_format($produto['preco'], 2, ',', '.'); ?></strong>
            </p>
            <?php if (($produto['estoque'] ?? 0) > 0): ?>
                <?php if ($produto['estoque'] <= 5): ?>
                    <p class="aviso-estoque">Restam <?php echo $produto['estoque']; ?> unidades</p>
                <?php endif; ?>
                <form action="carrinho.html" method="post">
                    <input type="hidden" name="acao" value="adicionar">
                    <input type="hidden" name="produto_id" value="<?php echo $produto['id']; ?>">
                    <input type="hidden" name="origem" value="promocoes.html">
                    <button type="submit">Comprar</button>
                </form>
            <?php else: ?>
                <button type="button" class="btn-esgotado" disabled>Esgotado</button>
            <?php endif; ?>
        </article>
    <?php endforeach; ?>
</div>
