<?php
// ============================================================
// LÓGICA (PHP) — equipe de back-end
// ============================================================
require_once 'includes/banco_ficticio.php';

$totalItens = contarItensCarrinho();
$produtos = listarProdutosAtivos();

// Se veio ?categoria=Cimento na URL (clique num card de categoria),
// filtra a lista só com os produtos daquela categoria.
$categoriaSelecionada = trim($_GET['categoria'] ?? '');
if ($categoriaSelecionada !== '') {
    $produtos = array_filter($produtos, function ($p) use ($categoriaSelecionada) {
        return isset($p['categoria']) && $p['categoria'] === $categoriaSelecionada;
    });
}

$tituloPagina = 'Produtos - Construlink';
$paginaAtiva = 'produtos';
require 'includes/header.php';
?>
<!-- ============================================================
     HTML/CSS — equipe de front-end mexe livremente aqui
     ============================================================ -->

<div class="produtos">
    <?php if ($categoriaSelecionada !== ''): ?>
        <h2><?php echo htmlspecialchars($categoriaSelecionada); ?></h2>
        <p class="filtro-categoria"><a href="produtos.html">&larr; Ver todos os produtos</a></p>
    <?php else: ?>
        <h2>Todos os Produtos</h2>
    <?php endif; ?>

    <?php if (isset($_GET['adicionado'])): ?>
        <p class="mensagem-sucesso">Produto adicionado ao carrinho!</p>
    <?php endif; ?>
    <?php if (isset($_GET['semestoque'])): ?>
        <p class="mensagem-erro">Não há mais estoque suficiente desse produto.</p>
    <?php endif; ?>

    <?php if ($categoriaSelecionada !== '' && empty($produtos)): ?>
        <p>Nenhum produto encontrado nessa categoria no momento.</p>
    <?php endif; ?>

    <?php foreach ($produtos as $produto): ?>
        <article class="produto">
            <img src="<?php echo htmlspecialchars($produto['imagem']); ?>" alt="<?php echo htmlspecialchars($produto['nome']); ?>">
            <h3><?php echo htmlspecialchars($produto['nome']); ?></h3>
            <p>R$ <?php echo number_format($produto['preco'], 2, ',', '.'); ?></p>
            <?php if (($produto['estoque'] ?? 0) > 0): ?>
                <?php if ($produto['estoque'] <= 5): ?>
                    <p class="aviso-estoque">Restam <?php echo $produto['estoque']; ?> unidades</p>
                <?php endif; ?>
                <form action="carrinho.html" method="post">
                    <input type="hidden" name="acao" value="adicionar">
                    <input type="hidden" name="produto_id" value="<?php echo $produto['id']; ?>">
                    <input type="hidden" name="origem" value="produtos.html">
                    <button type="submit">Comprar</button>
                </form>
            <?php else: ?>
                <button type="button" class="btn-esgotado" disabled>Esgotado</button>
            <?php endif; ?>
        </article>
    <?php endforeach; ?>
</div>

<?php require 'includes/footer.php'; ?>
